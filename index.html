<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
  <title>My Dystopian Robot Girlfriend</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
</head>
<body class="dark">
  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas"></canvas>
  </div>
  <div id="loading-cover" style="display:none;">
    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty" style="display: none;">
        <div id="unity-progress-bar-full"></div>
      </div>
      <div id="unity-mobile-warning">
        Warning! WebGL on mobile devices isn't really supported! Play in the browser ONLY if you have no other option!(As in you are on the IOS)
      </div>
      <div class="spinner"></div>
    </div>
  </div>
  <script>
    const buildUrl = "Build";
    const loaderUrl = buildUrl + "/My Dystopian Robot Girlfriend.loader.js";
    const config = {
      dataUrl: buildUrl + "/My Dystopian Robot Girlfriend.data.unityweb",
      frameworkUrl: buildUrl + "/My Dystopian Robot Girlfriend.framework.js.unityweb",
      codeUrl: buildUrl + "/My Dystopian Robot Girlfriend.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "IncontinentCell",
      productName: "My Dystopian Robot Girlfriend",
      productVersion: "0.87.11",
    };
  
    const container = document.querySelector("#unity-container");
    const canvas = document.querySelector("#unity-canvas");
    const loadingCover = document.querySelector("#loading-cover");
    const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
    const progressBarFull = document.querySelector("#unity-progress-bar-full");
    const mobileWarning = document.querySelector("#unity-mobile-warning");
    const spinner = document.querySelector('.spinner');
    
    // By default Unity keeps WebGL canvas render target size matched with
    // the DOM size of the canvas element (scaled by window.devicePixelRatio)
    // Set this to false if you want to decouple this synchronization from
    // happening inside the engine, and you would instead like to size up
    // the canvas DOM size and WebGL render target sizes yourself.
    // config.matchWebGLToCanvasSize = false;
    
    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      container.className = "unity-mobile";
      //config.devicePixelRatio = 1;
      mobileWarning.style.display = "block";
      setTimeout(() => {
        mobileWarning.style.display = "none";
      }, 5000);
    }
    
    loadingCover.style.display = "";
  
    const script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        spinner.style.display = "none";
        progressBarEmpty.style.display = "";
        progressBarFull.style.width = `${100 * progress}%`;
      }).then((unityInstance) => {
        loadingCover.style.display = "none";
      }).catch((message) => {
        alert(message);
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
